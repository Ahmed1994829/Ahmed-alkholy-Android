
name: Build Ahmed alkholy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for file in ./*.zip; do
            [ -f "$file" ] || continue

            if unzip -Z1 "$file" | grep -Eq '(^|/)app/build.gradle.kts$'; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"

          APP_GRADLE=$(find "$RUNNER_TEMP/android-project" -type f -path '*/app/build.gradle.kts' -print -quit)

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/ahmedalkholy/app/MainActivity.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-alkholy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
